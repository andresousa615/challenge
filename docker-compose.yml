services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ferrapex
      POSTGRES_PASSWORD: ferrapex
      POSTGRES_DB: ferrapex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferrapex -d ferrapex"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://ferrapex:ferrapex@db:5432/ferrapex
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
